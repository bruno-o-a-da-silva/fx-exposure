[project]
name = "fx-exposure"
version = "0.0.1"
description = "Margin at risk on open USD purchase orders under rate scenarios, with a static HTML report"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
figures = ["matplotlib"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fx_exposure = ["report.html.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=fx_exposure --cov-report=term-missing --cov-fail-under=100"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
